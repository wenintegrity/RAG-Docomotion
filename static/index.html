<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docomotion Assistant</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1d2330; --muted: #6b7385;
    --border: #e2e5eb; --accent: #2563eb; --accent-text: #ffffff;
    --user-bubble: #2563eb; --bot-bubble: #f1f3f7; --error: #b42318; --error-bg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --panel: #171b23; --text: #e6e9ef; --muted: #98a1b3;
      --border: #2a303c; --accent: #4f8cff; --accent-text: #ffffff;
      --user-bubble: #3b74e6; --bot-bubble: #222835; --error: #ff8a80; --error-bg: #3a1d1d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; min-height: 100vh; padding: 24px 16px;
  }
  .chat {
    width: 100%; max-width: 820px; height: calc(100vh - 48px);
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 17px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--user-bubble); color: var(--accent-text); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .bot { align-self: flex-start; background: var(--bot-bubble); border-bottom-left-radius: 4px; }
  .bot p { margin: 0 0 8px; } .bot p:last-child { margin-bottom: 0; }
  .bot ul, .bot ol { margin: 4px 0 8px; padding-left: 22px; }
  .bot a { color: var(--accent); }
  .bot code { background: rgba(127,127,127,.15); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .bot pre { background: rgba(127,127,127,.12); padding: 10px; border-radius: 8px; overflow-x: auto; }
  .bot pre code { background: none; padding: 0; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .error { align-self: flex-start; background: var(--error-bg); color: var(--error); }
  .thinking { color: var(--muted); font-style: italic; }
  .thinking::after { content: ""; animation: dots 1.4s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; }
  .suggestions button {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .suggestions button:hover { border-color: var(--accent); color: var(--accent); }
  form { display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--border); }
  textarea {
    flex: 1; resize: none; height: 46px; max-height: 140px; padding: 11px 12px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font: inherit;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #send {
    border: 0; border-radius: 10px; padding: 0 18px; background: var(--accent); color: var(--accent-text);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: default; }
  @media (max-width: 600px) { body { padding: 0; } .chat { height: 100vh; border-radius: 0; border: 0; } .msg { max-width: 92%; } }
</style>
</head>
<body>
<main class="chat">
  <header>
    <h1>Docomotion Assistant</h1>
    <p>Answers from the Docomotion knowledge base (docomotion.com/support)</p>
  </header>

  <div id="messages" aria-live="polite">
    <div class="msg bot">
      <p>Hi! Ask me anything about Docomotion. Answers take about 20 seconds.</p>
      <div class="suggestions">
        <button type="button">What permission sets does Docomotion support?</button>
        <button type="button">How do I add a Generate button to a record page?</button>
        <button type="button">How do I protect a PDF with a password?</button>
        <button type="button">What is the Live Editor?</button>
      </div>
    </div>
  </div>

  <form id="form">
    <textarea id="input" placeholder="Ask a question… (Enter to send, Shift+Enter for a new line)" aria-label="Your question"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</main>

<script>
  const messages = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  function addMessage(cls, content, isHtml = false) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    if (isHtml) div.innerHTML = content; else div.textContent = content;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function renderMarkdown(text) {
    const html = DOMPurify.sanitize(marked.parse(text));
    // Open source links in a new tab
    return html.replace(/<a /g, '<a target="_blank" rel="noopener" ');
  }

  async function ask(question) {
    question = question.trim();
    if (!question || send.disabled) return;
    addMessage("user", question);
    input.value = "";
    send.disabled = true;
    const pending = addMessage("bot thinking", "Searching the knowledge base and writing an answer");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      pending.remove();
      if (!res.ok) {
        addMessage("error", "Error: " + (data.error || res.statusText));
      } else {
        const div = addMessage("bot", renderMarkdown(data.answer), true);
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `Answered in ${data.seconds}s`;
        div.appendChild(meta);
      }
    } catch (err) {
      pending.remove();
      addMessage("error", "Could not reach the server. Is app.py still running?");
    } finally {
      send.disabled = false;
      input.focus();
      messages.scrollTop = messages.scrollHeight;
    }
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); ask(input.value); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); }
  });
  document.querySelectorAll(".suggestions button").forEach((b) =>
    b.addEventListener("click", () => ask(b.textContent))
  );
  input.focus();
</script>
</body>
</html>
